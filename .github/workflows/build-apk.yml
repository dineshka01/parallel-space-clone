name: Build Parallel Space Clone APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android Build Tools + NDK
        run: |
          sdkmanager "build-tools;35.0.0" "platforms;android-35" "platform-tools"
          sdkmanager "ndk;29.0.13846066"

      - name: Check for bcore.aar
        id: check_aar
        run: |
          if [ -f "app/libs/bcore.aar" ] && [ $(stat -c%s "app/libs/bcore.aar") -gt 50000 ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "bcore.aar found ($(stat -c%s app/libs/bcore.aar) bytes)"
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "bcore.aar not found — building from source"
          fi

      - name: Clone NewBlackbox and Build Bcore AAR
        if: steps.check_aar.outputs.found == 'false'
        run: |
          git clone --depth=1 https://github.com/ALEX5402/NewBlackbox.git /tmp/NewBlackbox
          cd /tmp/NewBlackbox

          echo "=== Original settings.gradle ==="
          cat settings.gradle

          # Replace ONLY settings.gradle — remove Aliyun mirrors, keep all else intact
          cat > settings.gradle << 'SETTINGS_EOF'
pluginManagement {
    repositories {
        maven { url "https://www.jitpack.io" }
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        maven { url "https://www.jitpack.io" }
        google()
        mavenCentral()
    }
}

rootProject.name = "NewBlackbox"

include ':app'
include(":black-reflection")
include(":compiler")
include ':Bcore'
SETTINGS_EOF

          echo "=== Modified settings.gradle ==="
          cat settings.gradle

          chmod +x gradlew
          ./gradlew :Bcore:assembleRelease --no-daemon --stacktrace 2>&1 | tail -60

          AAR=$(find Bcore/build/outputs/aar -name "*.aar" 2>/dev/null | head -1)
          if [ -n "$AAR" ] && [ -f "$AAR" ] && [ $(stat -c%s "$AAR") -gt 1000 ]; then
            mkdir -p $GITHUB_WORKSPACE/app/libs
            cp "$AAR" $GITHUB_WORKSPACE/app/libs/bcore.aar
            echo "SUCCESS: $(stat -c%s $GITHUB_WORKSPACE/app/libs/bcore.aar) bytes"
          else
            echo "ERROR: Bcore AAR not found after build"
            find /tmp/NewBlackbox/Bcore/build -name "*.aar" 2>/dev/null || true
            find /tmp/NewBlackbox/Bcore/build -name "*.log" 2>/dev/null -exec cat {} \; || true
            exit 1
          fi

      - name: Verify bcore.aar
        run: |
          ls -lh app/libs/bcore.aar
          echo "Size: $(stat -c%s app/libs/bcore.aar) bytes"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant Gradle Wrapper Permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ParallelSpace-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon
        continue-on-error: true

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ParallelSpace-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Show APK Files
        run: find app/build/outputs -name "*.apk" 2>/dev/null || echo "No APK found"
