name: Build Parallel Space Clone APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android Build Tools
        run: sdkmanager "build-tools;35.0.0" "platforms;android-35" "platform-tools"

      - name: Show pre-installed NDK versions
        run: ls $ANDROID_SDK_ROOT/ndk/ 2>/dev/null && echo "NDK_LATEST=$ANDROID_NDK_LATEST_HOME"

      - name: Check for bcore.aar
        id: check_aar
        run: |
          if [ -f "app/libs/bcore.aar" ] && [ $(stat -c%s "app/libs/bcore.aar") -gt 50000 ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "bcore.aar found ($(stat -c%s app/libs/bcore.aar) bytes)"
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "bcore.aar not found, will build from source"
          fi

      - name: Build Bcore AAR from NewBlackbox
        if: steps.check_aar.outputs.found == 'false'
        run: |
          NDK_VER=$(ls $ANDROID_SDK_ROOT/ndk/ | sort -V | tail -1)
          NDK_DIR="$ANDROID_SDK_ROOT/ndk/$NDK_VER"
          echo "Using NDK: $NDK_VER at $NDK_DIR"

          git clone --depth=1 https://github.com/ALEX5402/NewBlackbox.git /tmp/NewBlackbox
          cd /tmp/NewBlackbox

          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ndk.dir=$NDK_DIR" >> local.properties

          # Remove Aliyun URLs from settings.gradle using sed
          sed -i "/maven.aliyun/d" settings.gradle
          sed -i "/aliyun/d" settings.gradle
          cat settings.gradle

          # Patch ndkVersion in Bcore/build.gradle to match installed NDK
          sed -i "s|ndkVersion = \"[^\"]*\"|ndkVersion = \"$NDK_VER\"|g" Bcore/build.gradle
          grep "ndkVersion" Bcore/build.gradle

          chmod +x gradlew
          ./gradlew :Bcore:assembleRelease --no-daemon --stacktrace 2>&1 | tail -100

          AAR=$(find Bcore/build/outputs/aar -name "*.aar" 2>/dev/null | head -1)
          if [ -n "$AAR" ] && [ $(stat -c%s "$AAR") -gt 1000 ]; then
            mkdir -p $GITHUB_WORKSPACE/app/libs
            cp "$AAR" $GITHUB_WORKSPACE/app/libs/bcore.aar
            echo "SUCCESS: $(stat -c%s $GITHUB_WORKSPACE/app/libs/bcore.aar) bytes"
          else
            echo "ERROR: Bcore AAR not produced"
            find /tmp/NewBlackbox/Bcore/build -type f 2>/dev/null | head -20
            exit 1
          fi

      - name: Verify bcore.aar
        run: ls -lh app/libs/bcore.aar && echo "$(stat -c%s app/libs/bcore.aar) bytes"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant Gradle Wrapper Permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ParallelSpace-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon
        continue-on-error: true

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ParallelSpace-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
