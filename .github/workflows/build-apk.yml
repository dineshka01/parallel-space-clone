name: Build Parallel Space Clone APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download BlackBox Bcore AAR
        run: |
          mkdir -p app/libs
          # Try to download pre-built AAR
          # Agar AAR public available nahi hai to yeh fail ho sakta hai
          # Alternative: NewBlackbox clone karein aur build karein
          if [ ! -f app/libs/bcore.aar ]; then
            echo "Creating placeholder — use pre-built AAR from releases"
            # Actual AAR download URL — replace with real URL
            # curl -L -o app/libs/bcore.aar https://example.com/bcore-release.aar
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/wrapper/gradle-wrapper.jar
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant Gradle Wrapper Permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK (Unsigned)
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ParallelSpace-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ParallelSpace-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: List Build Outputs
        run: |
          echo "=== Build Outputs ==="
          find app/build/outputs -name "*.apk" -type f
